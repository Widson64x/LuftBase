{% extends "luftbase/base.html" %}
{% block title %}Acesso Negado{% endblock %}

{% block content %}
<div class="is-placeholder animate-slide-up h-full d-flex flex-col align-items-center justify-content-center">
    <div class="luft-error-icon-box text-danger bg-danger-light" style="width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <i class="ph-fill ph-shield-warning" style="font-size: 5rem;"></i>
    </div>
    <h1 class="mt-6 font-black text-4xl text-main">Acesso Negado</h1>
    <p class="text-muted mt-2 max-w-lg text-center">Você não tem permissões suficientes para acessar esta página ou recurso. Se você acha que isso é um erro, contate o administrador do sistema.</p>
    
    <div class="d-flex gap-4 mt-8">
        <button onclick="history.back()" class="btn btn-outline hover-lift">
            <i class="ph-bold ph-arrow-left"></i> Voltar
        </button>
        <a href="{{ url_raiz_aplicacao | default(luft_url_raiz) | default('/') }}" class="btn btn-primary hover-lift">
            <i class="ph-bold ph-house"></i> Ir para o Início
        </a>
    </div>
</div>
{% endblock %}
