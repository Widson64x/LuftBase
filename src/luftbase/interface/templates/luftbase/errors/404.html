{% extends "luftbase/base.html" %}

{% block content %}
<div class="is-placeholder animate-fade-in">
    <div class="mb-4">
        <i class="ph-duotone ph-magnifying-glass animate-bounce text-danger" style="font-size: 8rem;"></i>
    </div>

    <h1 class="font-black text-main mb-0" style="font-size: 7rem; line-height: 1;">404</h1>
    <h2 class="font-bold text-2xl text-muted mb-4">Página não encontrada</h2>

    <p class="text-muted text-lg mb-8 mx-auto" style="max-width: 500px;">
        O recurso que procura no servidor <strong>{{ luft_app_name | default('Sistema') }}</strong> não existe ou foi movido.
    </p>

    <div class="d-flex gap-3">
        <a href="javascript:history.back()" class="btn btn-outline hover-lift px-6 py-2">
            <i class="ph-bold ph-arrow-left"></i> Voltar
        </a>
        <a href="{{ request.script_root }}/" class="btn btn-primary hover-lift shadow-md px-6 py-2">
            <i class="ph-bold ph-house"></i> Ir para o Início
        </a>
    </div>
</div>
{% endblock %}
