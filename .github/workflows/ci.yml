name: CI LuftBase

# Barra a tag ruim antes de ela chegar aos apps (que instalam o LuftBase pela tag do GitHub).
# A matriz roda nos DOIS sistemas: o bug do horario 3 h adiantado so existia no Windows.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Testes
        run: python -m pytest -q

      - name: Tipos (mypy) - informativo ate a divida de tipos zerar
        continue-on-error: true
        run: python -m mypy src/luftbase

      - name: Montar o wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m build

  versao-da-tag:
    name: Tag igual a versao do pacote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir
        run: |
          versao=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$versao" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} diferente da versao $versao"; exit 1; }
