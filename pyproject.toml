[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luft-base"
version = "0.1.0a75"
description = "Plataforma corporativa para aplicacoes Python da Luft."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TI e Inovacao Luft", email = "widson.araujo@luftlogistics.com" },
]
dependencies = [
    "alembic>=1.13,<2",
    "Flask>=3.0,<4",
    "Flask-Login>=0.6,<1",
    "SQLAlchemy>=2.0,<3",
    "cryptography>=43,<51",
    "hvac>=2.3,<3",
    "itsdangerous>=2.2,<3",
    "ldap3>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pyodbc>=5.2,<6",
    "python-dotenv>=1.0,<2",
    "redis>=5,<7",
    "waitress>=3,<4",
]

[project.scripts]
luftbase = "luftbase.cli:cli"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "types-hvac>=2.3,<3",
    "types-ldap3>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luftbase = [
    "interface/static/css/*.css",
    "interface/static/css/temas/*.css",
    "interface/static/icons/*.png",
    "interface/static/img/background/*.jpg",
    "interface/static/img/background/*.jpeg",
    "interface/static/img/background/*.png",
    "interface/static/img/email/*.png",
    "interface/static/img/changelog/*.svg",
    "interface/static/js/*.js",
    "interface/static/video/*.json",
    "interface/templates/luftbase/*.html",
    "interface/templates/luftbase/**/*.html",
    "migracoes/script.py.mako",
    "py.typed",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["luftbase"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/luftbase/migracoes/versoes/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["luftbase"]

[[tool.mypy.overrides]]
module = ["flask_login"]
ignore_missing_imports = true
